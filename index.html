<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="JuZhou Technical Report project page."
    />
    <title>JuZhou Technical Report</title>
    <style>
      :root {
        --ink: #0b1f22;
        --muted: #5d686b;
        --teal: #07515c;
        --teal-2: #078894;
        --paper: #fbfcfb;
        --line: #d9e4e2;
        --accent: #c88a2c;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family: "Aptos", "Segoe UI", sans-serif;
        background:
          linear-gradient(90deg, rgba(7, 81, 92, 0.055) 1px, transparent 1px),
          linear-gradient(rgba(7, 81, 92, 0.045) 1px, transparent 1px),
          var(--paper);
        background-size: 56px 56px;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 64px 24px;
      }

      .hero {
        width: min(920px, 100%);
        text-align: center;
      }

      .logo-wrap {
        width: min(260px, 72vw);
        height: 172px;
        margin: 0 auto 28px;
        overflow: hidden;
      }

      .logo {
        width: 100%;
        height: auto;
        display: block;
        transform: translateY(-42px);
        filter: drop-shadow(0 22px 34px rgba(7, 81, 92, 0.14));
      }

      h1 {
        max-width: 780px;
        margin: 0 auto;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(44px, 8vw, 86px);
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .authors {
        margin: 24px 0 0;
        font-size: clamp(18px, 2.4vw, 24px);
        font-weight: 650;
      }

      .affiliation {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: clamp(16px, 2vw, 20px);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 36px;
      }

      .action {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 18px;
        border: 1px solid rgba(7, 81, 92, 0.2);
        border-radius: 999px;
        color: var(--teal);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 28px rgba(7, 81, 92, 0.08);
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease;
      }

      .action svg {
        width: 19px;
        height: 19px;
        flex: 0 0 auto;
        stroke-width: 2;
      }

      .action[href]:hover,
      .action[href]:focus-visible {
        color: #ffffff;
        border-color: var(--teal);
        background: linear-gradient(135deg, var(--teal), var(--teal-2));
        box-shadow: 0 18px 42px rgba(7, 81, 92, 0.2);
        transform: translateY(-2px);
        outline: none;
      }

      .action.is-disabled {
        color: #738082;
        background: rgba(255, 255, 255, 0.58);
        border-style: dashed;
        box-shadow: none;
        cursor: default;
      }

      .action.is-disabled svg {
        color: var(--accent);
      }

      @media (max-width: 560px) {
        main {
          padding: 44px 18px;
        }

        .logo-wrap {
          width: 220px;
          height: 146px;
          margin-bottom: 22px;
        }

        .logo {
          transform: translateY(-36px);
        }

        .actions {
          gap: 10px;
          margin-top: 30px;
        }

        .action {
          min-width: 136px;
          min-height: 46px;
          padding: 0 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="logo-wrap" aria-label="HuiShiWei logo">
          <img
            class="logo"
            src="assets/huishiwei-logo.png"
            alt="HuiShiWei"
          />
        </div>

        <h1 id="page-title">JuZhou Technical Report</h1>
        <p class="authors">JuZhou Team</p>
        <p class="affiliation">HuiShiWei</p>

        <nav class="actions" aria-label="Project links">
          <span class="action is-disabled" aria-disabled="true" title="Coming soon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z" />
              <path d="M14 2v5h5" />
              <path d="M9 13h6" />
              <path d="M9 17h4" />
            </svg>
            Paper
          </span>

          <a
            class="action"
            href="https://github.com/HswAI2026/JuZhou-V1"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M9 19c-4.3 1.4-4.3-2.1-6-2.5" />
              <path d="M15 22v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.1-1.5 6.1-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.1-.3-3.7 1.4a12.8 12.8 0 0 0-6.7 0C5.7.3 4.6.6 4.6.6a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.1 6.4 6.1 6.7a3.4 3.4 0 0 0-.9 2.6V22" />
            </svg>
            Code
          </a>

          <a
            class="action"
            href="https://huggingface.co/HswAI2026/JuZhou-V1"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="m21 16-9 5-9-5V8l9-5 9 5z" />
              <path d="m3.3 7.6 8.7 5 8.7-5" />
              <path d="M12 22V12" />
            </svg>
            Model
          </a>

          <a
            class="action"
            href="https://sc-web.huishiwei.cn/#/scenarioDetail/48"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2" />
              <path d="M8 20h8" />
              <path d="M12 16v4" />
              <path d="m10 8 5 2.5-5 2.5z" />
            </svg>
            Demo
          </a>

          <a
            class="action"
            href="https://www.pgyer.com/mojiemobilellm-android"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="7" y="2" width="10" height="20" rx="2" />
              <path d="M11 18h2" />
              <path d="M10 6h4" />
            </svg>
            APP
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
