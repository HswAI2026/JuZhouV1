<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="JuZhou 1.0 Technical Report project page."
    />
    <title>JuZhou 1.0 Technical Report</title>
    <style>
      :root {
        --ink: #152322;
        --muted: #667170;
        --paper: #fbfcfb;
        --teal: #07515c;
        --cyan: #078894;
        --mint: #68bfae;
        --gold: #d49a2a;
        --line: rgba(7, 81, 92, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family: "Aptos", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 8%, rgba(104, 191, 174, 0.18), transparent 26rem),
          radial-gradient(circle at 78% 16%, rgba(212, 154, 42, 0.14), transparent 27rem),
          linear-gradient(180deg, #ffffff 0%, #f6faf8 58%, #ffffff 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(7, 81, 92, 0.045) 1px, transparent 1px),
          linear-gradient(rgba(7, 81, 92, 0.035) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(180deg, #000, transparent 80%);
      }

      img {
        display: block;
        max-width: 100%;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 56px 22px;
      }

      .hero {
        position: relative;
        width: min(1120px, 100%);
        text-align: center;
      }

      .logo-wrap {
        width: min(236px, 60vw);
        height: 146px;
        display: grid;
        place-items: center;
        margin: 0 auto 30px;
        overflow: hidden;
        border: 1px solid rgba(7, 81, 92, 0.12);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 22px 60px rgba(7, 81, 92, 0.12);
        backdrop-filter: blur(10px);
      }

      .logo {
        width: 230px;
        max-width: none;
        transform: translateY(-37px);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--teal);
        font-size: 14px;
        font-weight: 850;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 1060px;
        margin: 0 auto;
        font-family: Georgia, Cambria, "Times New Roman", serif;
        font-size: clamp(42px, 7vw, 92px);
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: 0;
        text-wrap: balance;
      }

      .gradient-title {
        display: inline-block;
        color: transparent;
        background: linear-gradient(92deg, #074952 4%, #098994 34%, #3aa98f 62%, #d29a2a 96%);
        background-clip: text;
        -webkit-background-clip: text;
      }

      .title-tail {
        display: block;
        max-width: 900px;
        margin: 16px auto 0;
        color: #34413f;
        font-family: "Aptos", "Segoe UI", sans-serif;
        font-size: clamp(20px, 2.8vw, 34px);
        font-weight: 750;
        line-height: 1.24;
      }

      .authors {
        margin: 28px 0 0;
        color: #263331;
        font-size: clamp(18px, 2.2vw, 24px);
        font-weight: 750;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 34px;
      }

      .action {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--teal);
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 12px 30px rgba(7, 81, 92, 0.08);
        font-size: 16px;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease;
      }

      .action svg {
        width: 19px;
        height: 19px;
        flex: 0 0 auto;
        stroke-width: 2;
      }

      .action .hf-icon {
        width: 23px;
        height: 23px;
        flex: 0 0 auto;
        object-fit: contain;
      }

      .action[href]:hover,
      .action[href]:focus-visible {
        color: #ffffff;
        border-color: transparent;
        background: linear-gradient(135deg, var(--teal), var(--cyan));
        box-shadow: 0 18px 44px rgba(7, 81, 92, 0.2);
        transform: translateY(-2px);
        outline: none;
      }

      .action.is-disabled {
        color: #778382;
        border-style: dashed;
        background: rgba(255, 255, 255, 0.56);
        box-shadow: none;
        cursor: default;
      }

      .action.is-disabled svg {
        color: var(--gold);
      }

      @media (max-width: 560px) {
        main {
          padding: 40px 16px;
        }

        .logo-wrap {
          width: 190px;
          height: 120px;
          margin-bottom: 24px;
          border-radius: 16px;
        }

        .logo {
          width: 184px;
          transform: translateY(-30px);
        }

        .actions {
          gap: 10px;
          margin-top: 30px;
        }

        .action {
          min-width: 132px;
          min-height: 46px;
          padding: 0 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="logo-wrap" aria-label="HuiShiWei logo">
          <img
            class="logo"
            src="assets/huishiwei-logo.png"
            alt="HuiShiWei"
          />
        </div>

        <p class="eyebrow">Edge-native text-to-image foundation model</p>
        <h1 id="page-title">
          <span class="gradient-title">JuZhou 1.0 Technical Report</span>
          <span class="title-tail">
            The First Edge-Native Text-to-Image Foundation Model Trained Entirely on China-Developed AI Accelerators
          </span>
        </h1>
        <p class="authors">JuZhou Team, HSW Group</p>

        <nav class="actions" aria-label="Project links">
          <span class="action is-disabled" aria-disabled="true" title="Coming soon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z" />
              <path d="M14 2v5h5" />
              <path d="M9 13h6" />
              <path d="M9 17h4" />
            </svg>
            Paper
          </span>

          <a
            class="action"
            href="https://github.com/HswAI2026/JuZhou-V1"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path d="M9 19c-4.3 1.4-4.3-2.1-6-2.5" />
              <path d="M15 22v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.1-1.5 6.1-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.1-.3-3.7 1.4a12.8 12.8 0 0 0-6.7 0C5.7.3 4.6.6 4.6.6a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.1 6.4 6.1 6.7a3.4 3.4 0 0 0-.9 2.6V22" />
            </svg>
            Code
          </a>

          <a
            class="action"
            href="https://huggingface.co/HswAI2026/JuZhou-V1"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              class="hf-icon"
              src="assets/huggingface-logo.svg"
              alt=""
              aria-hidden="true"
            />
            Model
          </a>

          <a
            class="action"
            href="https://sc-web.huishiwei.cn/#/scenarioDetail/48"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="3" y="4" width="18" height="14" rx="2" />
              <path d="M3 8h18" />
              <path d="m9 12 3 3 6-6" />
              <path d="M8 21h8" />
              <path d="M12 18v3" />
            </svg>
            Demo
          </a>

          <a
            class="action"
            href="https://www.pgyer.com/mojiemobilellm-android"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="7" y="2" width="10" height="20" rx="2" />
              <path d="M11 18h2" />
              <path d="M10 6h4" />
            </svg>
            APP
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
